<!DOCTYPE html>
<html lang="en">
<head>

<title>Debugging AI-Generated Loops</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;900&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; font-family: 'Geist', sans-serif; background: #f5f5f7; color: #000; overflow: hidden; }

.skip-link { position: absolute; top: -999px; left: -999px; background: #6A62D9; color: #fff; padding: 8px 16px; border-radius: 8px; font-weight: 700; font-size: 0.9rem; z-index: 9999; text-decoration: none; }
.skip-link:focus { top: 12px; left: 12px; }

.screen { display: none; width: 100%; height: 100vh; flex-direction: column; overflow: hidden; }
.screen.active { display: flex; }

/* ══ INTRO SCREEN ══ */
#screen-intro {
  background: #f5f5f7;
  overflow-y: auto;
  align-items: center;
  padding: 36px 24px 60px;
}
.intro-page {
  max-width: 680px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 20px;
}


.hero {
  background: #6A62D9; border-radius: 16px; padding: 28px 32px;
  color: #fff; display: flex; gap: 24px; align-items: center;
  position: relative; overflow: hidden;
}
.hero::before { content: ''; position: absolute; top: -50px; right: -50px; width: 180px; height: 180px; background: rgba(255,255,255,0.06); border-radius: 50%; pointer-events: none; }
.hero::after  { content: ''; position: absolute; bottom: -40px; left: 20%; width: 140px; height: 140px; background: rgba(255,255,255,0.04); border-radius: 50%; pointer-events: none; }
.hero-text { flex: 1; position: relative; z-index: 1; }
.hero-eyebrow { font-size: 0.68rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 8px; }
.hero-title { font-size: 1.5rem; font-weight: 900; color: #fff; line-height: 1.2; letter-spacing: -0.3px; margin-bottom: 8px; }
.hero-sub { font-size: 0.82rem; color: rgba(255,255,255,0.8); line-height: 1.6; }
.hero-img { width: 100px; height: 100px; object-fit: cover; object-position: top; border-radius: 12px; border: 2.5px solid rgba(255,255,255,0.25); flex-shrink: 0; position: relative; z-index: 1; display: block; }

.scenario-card { background: #fff; border: 1.5px solid #e5e5e5; border-radius: 14px; overflow: hidden; }
.scenario-header { background: #000; padding: 10px 18px; display: flex; align-items: center; gap: 10px; }
.scenario-header-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); }
.scenario-header-title { font-size: 0.8rem; font-weight: 700; color: #fff; }
.scenario-body { padding: 18px 20px; display: flex; gap: 18px; align-items: flex-start; }
.scenario-img { width: 86px; height: 86px; object-fit: cover; object-position: top; border-radius: 10px; border: 2px solid #e5e5e5; flex-shrink: 0; display: block; }
.scenario-text { flex: 1; }
.scenario-scene-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6A62D9; margin-bottom: 6px; }
.scenario-quote { font-size: 0.85rem; color: #111; line-height: 1.65; font-style: italic; border-left: 3px solid #6A62D9; padding-left: 12px; margin-bottom: 10px; }
.scenario-body-text { font-size: 0.8rem; color: #444; line-height: 1.65; }
.scenario-body-text strong { color: #000; font-weight: 700; }

.code-preview { background: #1e1e2e; border-radius: 14px; overflow: hidden; border: 1.5px solid #2d2d42; }
.code-preview-header { background: #181825; padding: 8px 14px; display: flex; align-items: center; gap: 7px; border-bottom: 1px solid #2d2d42; }
.cp-dot { width: 9px; height: 9px; border-radius: 50%; }
.cp-dot.r { background: #ff5f57; } .cp-dot.y { background: #febc2e; } .cp-dot.g { background: #28c840; }
.cp-label { font-family: 'Fira Code', monospace; font-size: 0.67rem; color: #6c7086; margin-left: 4px; }
.code-preview-body { padding: 14px 18px; font-family: 'Fira Code', monospace; font-size: 0.78rem; line-height: 1.8; }

.mission-box { background: #fff; border: 1.5px solid #e5e5e5; border-radius: 14px; padding: 18px 20px; }
.mission-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #6A62D9; margin-bottom: 10px; }
.mission-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px; }
.mission-step { background: #f5f5f7; border: 1.5px solid #e5e5e5; border-radius: 8px; padding: 8px 12px; font-size: 0.75rem; font-weight: 600; color: #333; display: flex; align-items: center; gap: 7px; }
.mission-step-num { width: 20px; height: 20px; border-radius: 50%; background: #6A62D9; color: #fff; font-size: 0.65rem; font-weight: 900; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.mission-divider { height: 1px; background: #e5e5e5; margin-bottom: 12px; }
.mission-desc { font-size: 0.8rem; color: #555; line-height: 1.65; }
.mission-desc strong { color: #000; }

.btn-start { background: #6A62D9; color: #fff; border: none; border-radius: 10px; padding: 14px 36px; font-family: 'Geist', sans-serif; font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%; box-shadow: 0 4px 20px rgba(106,98,217,0.3); transition: transform 0.15s, box-shadow 0.15s; }
.btn-start:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(106,98,217,0.4); }
.btn-start:focus-visible { outline: 3px solid #6A62D9; outline-offset: 3px; }
.start-note { text-align: center; font-size: 0.7rem; color: #aaa; font-weight: 500; margin-top: -10px; }

/* ══ ACTIVITY SCREEN ══ */
#screen-activity { flex-direction: row; background: #f5f5f7; }

/* IDE */
.ide-panel { width: 50%; height: 100%; display: flex; flex-direction: column; background: #1e1e2e; border-right: 1px solid #2d2d42; flex-shrink: 0; }
.ide-topbar { background: #181825; border-bottom: 1px solid #2d2d42; display: flex; align-items: center; flex-shrink: 0; }
.ide-dots { display: flex; gap: 5px; padding: 9px 12px; }
.ide-dot { width: 9px; height: 9px; border-radius: 50%; }
.ide-dot.r { background: #ff5f57; } .ide-dot.y { background: #febc2e; } .ide-dot.g { background: #28c840; }
.ide-tabs { display: flex; align-items: stretch; flex: 1; }
.ide-tab { padding: 7px 14px; font-family: 'Fira Code', monospace; font-size: 0.68rem; color: #6b7280; border-right: 1px solid #2d2d42; display: flex; align-items: center; gap: 5px; }
.ide-tab.active { background: #1e1e2e; color: #e2e8f0; }
.ide-tab-dot { width: 5px; height: 5px; border-radius: 50%; background: #6A62D9; }
.ide-body { flex: 1; overflow-y: auto; padding: 12px 0; scrollbar-width: thin; scrollbar-color: #2d2d42 transparent; }
.code-line { display: flex; align-items: center; min-height: 21px; font-family: 'Fira Code', monospace; font-size: 0.75rem; line-height: 1.65; position: relative; transition: background 0.3s; }
.code-line.hl-purple { background: rgba(106,98,217,0.18); }
.code-line.hl-green  { background: rgba(16,185,129,0.12); }
.line-num { width: 36px; text-align: right; padding-right: 12px; color: #3d3d5c; user-select: none; flex-shrink: 0; font-size: 0.67rem; }
.line-code { color: #cdd6f4; flex: 1; padding-right: 12px; }
.kw   { color: #cba6f7; }
.fn   { color: #89b4fa; }
.str  { color: #a6e3a1; }
.num  { color: #fab387; }
.cm   { color: #6c7086; font-style: italic; }
.op   { color: #89dceb; }
.var  { color: #cdd6f4; }
.punc { color: #ffffff; }
.todo { color: #fbbf24; font-style: italic; font-weight: 600; }
.bug-tag { display: none; position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: #ef4444; color: #fff; font-size: 0.58rem; font-weight: 700; font-family: 'Geist', sans-serif; padding: 2px 7px; border-radius: 999px; }
.bug-tag.show { display: block; }
.ide-console { background: #11111b; border-top: 1px solid #2d2d42; padding: 8px 14px; flex-shrink: 0; min-height: 54px; }
.console-label { font-family: 'Fira Code', monospace; font-size: 0.6rem; color: #6c7086; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
.console-out { font-family: 'Fira Code', monospace; font-size: 0.73rem; color: #6c7086; line-height: 1.5; }
.console-out .revealed { color: #a6e3a1; }
.console-out .warn { color: #f38ba8; }

/* RIGHT PANEL */
.right-panel { flex: 1; display: flex; flex-direction: column; height: 100%; overflow: hidden; background: #f5f5f7; }

.progress-wrap { padding: 14px 20px 12px; background: #fff; border-bottom: 1px solid #e5e5e5; flex-shrink: 0; }
.progress-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.progress-check-label { font-size: 0.72rem; font-weight: 700; color: #6A62D9; }
.progress-unit-label  { font-size: 0.68rem; font-weight: 500; color: #aaa; }
.progress-track { height: 4px; background: #e5e5e5; border-radius: 999px; overflow: hidden; }
.progress-fill  { height: 100%; background: #6A62D9; border-radius: 999px; transition: width 0.5s ease; }

.char-area { display: flex; align-items: flex-end; gap: 12px; padding: 12px 20px 10px; flex-shrink: 0; }
.char-img  { width: 68px; height: 68px; object-fit: cover; object-position: top; border-radius: 10px; border: 2px solid #e5e5e5; flex-shrink: 0; display: block; }
.char-name { font-size: 0.6rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 4px; }
.char-name.teacher { color: #6A62D9; }
.char-name.student  { color: #555; }
.char-bubble { background: #fff; border: 1.5px solid #e5e5e5; border-radius: 0 12px 12px 12px; padding: 9px 13px; font-size: 0.78rem; color: #222; line-height: 1.55; flex: 1; }
.char-bubble.teacher-bubble { border-radius: 12px 0 12px 12px; border-color: #d4d1f5; background: #faf9ff; }
.char-bubble code { font-family: 'Fira Code', monospace; font-size: 0.72rem; background: #f0eeff; color: #6A62D9; padding: 1px 5px; border-radius: 4px; }

.check-card { margin: 0 20px; background: #fff; border: 1.5px solid #e5e5e5; border-radius: 14px; overflow: hidden; flex-shrink: 0; }
.check-card-header { background: #6A62D9; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.check-card-num   { font-size: 0.62rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.65); }
.check-card-title { font-size: 0.88rem; font-weight: 700; color: #fff; }
.check-card-body  { padding: 14px 16px; }
.check-question   { font-size: 0.8rem; color: #333; line-height: 1.6; margin-bottom: 14px; }
.check-question code { font-family: 'Fira Code', monospace; font-size: 0.74rem; background: #f0eeff; color: #6A62D9; padding: 1px 5px; border-radius: 4px; }

.answer-btns { display: flex; gap: 10px; }
.btn-passes { flex: 1; background: #f0eeff; border: 1.5px solid #d4d1f5; color: #3d3a8c; border-radius: 8px; padding: 10px 14px; font-family: 'Geist', sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s, border-color 0.15s; }
.btn-passes:hover { background: #e4e1fb; border-color: #a29ff0; }
.btn-passes:focus-visible { outline: 3px solid #6A62D9; outline-offset: 2px; }
.btn-issue  { flex: 1; background: #f0eeff; border: 1.5px solid #d4d1f5; color: #3d3a8c; border-radius: 8px; padding: 10px 14px; font-family: 'Geist', sans-serif; font-size: 0.8rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: background 0.15s, border-color 0.15s; }
.btn-issue:hover  { background: #e4e1fb; border-color: #a29ff0; }
.btn-issue:focus-visible  { outline: 3px solid #6A62D9; outline-offset: 2px; }

.feedback-banner { display: none; margin-top: 12px; background: #f0eeff; border: 1.5px solid #d4d1f5; border-radius: 10px; padding: 12px 14px; gap: 10px; align-items: flex-start; }
.feedback-banner.show { display: flex; }
.feedback-icon { font-size: 1rem; flex-shrink: 0; margin-top: 1px; }
.feedback-label { font-size: 0.65rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; color: #6A62D9; margin-bottom: 3px; }
.feedback-body  { font-size: 0.78rem; color: #333; line-height: 1.6; }
.feedback-body code { font-family: 'Fira Code', monospace; font-size: 0.72rem; background: #e4e1fb; color: #6A62D9; padding: 1px 5px; border-radius: 4px; }

.btn-next { display: none; margin: 10px 20px 0; background: #6A62D9; color: #fff; border: none; border-radius: 8px; padding: 11px 20px; font-family: 'Geist', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer; width: calc(100% - 40px); box-shadow: 0 4px 14px rgba(106,98,217,0.28); flex-shrink: 0; transition: transform 0.15s; }
.btn-next:hover { transform: translateY(-1px); }
.btn-next:focus-visible { outline: 3px solid #6A62D9; outline-offset: 3px; }
.btn-next.show { display: block; }

/* ══ SUMMARY SCREEN ══ */
#screen-summary { background: #f5f5f7; overflow-y: auto; align-items: center; padding: 36px 24px 60px; }
.summary-page { max-width: 680px; width: 100%; display: flex; flex-direction: column; gap: 20px; }

.completion-header { background: #6A62D9; border-radius: 16px; padding: 28px 32px; color: #fff; display: flex; gap: 24px; align-items: center; position: relative; overflow: hidden; }
.completion-header::before { content: ''; position: absolute; top: -50px; right: -50px; width: 180px; height: 180px; background: rgba(255,255,255,0.06); border-radius: 50%; pointer-events: none; }
.completion-header::after  { content: ''; position: absolute; bottom: -40px; left: 20%; width: 140px; height: 140px; background: rgba(255,255,255,0.04); border-radius: 50%; pointer-events: none; }
.completion-text { flex: 1; position: relative; z-index: 1; }
.completion-eyebrow { font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 8px; }
.completion-title { font-size: 1.4rem; font-weight: 900; color: #fff; line-height: 1.2; letter-spacing: -0.3px; margin-bottom: 8px; }
.completion-sub   { font-size: 0.8rem; color: rgba(255,255,255,0.75); line-height: 1.6; }
.completion-img   { width: 96px; height: 96px; object-fit: cover; object-position: top; border-radius: 12px; border: 2.5px solid rgba(255,255,255,0.25); flex-shrink: 0; position: relative; z-index: 1; display: block; }

.bug-callout { background: #fff; border: 1.5px solid #e5e5e5; border-radius: 14px; overflow: hidden; }
.bug-callout-header { background: #000; padding: 10px 18px; display: flex; align-items: center; gap: 10px; }
.bug-callout-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.5); }
.bug-callout-title { font-size: 0.8rem; font-weight: 700; color: #fff; }
.bug-callout-body  { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.bug-code-wrap { background: #1e1e2e; border-radius: 10px; padding: 12px 16px; font-family: 'Fira Code', monospace; font-size: 0.76rem; line-height: 1.8; }
.bug-line  { background: rgba(239,68,68,0.15); border-radius: 4px; padding: 0 4px; display: block; }
.fix-line  { background: rgba(16,185,129,0.12); border-radius: 4px; padding: 0 4px; display: block; }
.bug-explanation { font-size: 0.8rem; color: #333; line-height: 1.65; }
.bug-explanation code { font-family: 'Fira Code', monospace; font-size: 0.74rem; background: #f0eeff; color: #6A62D9; padding: 1px 5px; border-radius: 4px; }

.recap-card { background: #fff; border: 1.5px solid #e5e5e5; border-radius: 14px; overflow: hidden; }
.recap-header { padding: 12px 18px; border-bottom: 1px solid #e5e5e5; display: flex; align-items: center; justify-content: space-between; }
.recap-title { font-size: 0.82rem; font-weight: 700; color: #000; }
.recap-legend { display: flex; gap: 12px; }
.legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.67rem; font-weight: 600; color: #888; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }
.legend-dot.issue { background: #6A62D9; }
.legend-dot.pass  { background: #d1d5db; }
.recap-list { padding: 4px 0; }
.recap-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 18px; border-bottom: 1px solid #f5f5f7; }
.recap-row:last-child { border-bottom: none; }
.recap-indicator { width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.68rem; font-weight: 900; flex-shrink: 0; margin-top: 2px; }
.recap-indicator.issue { background: #f0eeff; color: #6A62D9; border: 1.5px solid #d4d1f5; }
.recap-indicator.pass  { background: #f5f5f7; color: #aaa; border: 1.5px solid #e5e5e5; }
.recap-content { flex: 1; }
.recap-check-name { font-size: 0.78rem; font-weight: 700; color: #000; margin-bottom: 2px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.recap-badge { font-size: 0.58rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 2px 7px; border-radius: 999px; }
.recap-badge.issue { background: #f0eeff; color: #6A62D9; }
.recap-badge.pass  { background: #f5f5f7; color: #aaa; }
.recap-note { font-size: 0.73rem; color: #666; line-height: 1.5; }
.recap-note code { font-family: 'Fira Code', monospace; font-size: 0.68rem; background: #f0eeff; color: #6A62D9; padding: 1px 4px; border-radius: 4px; }

.takeaway-card { background: #fff; border: 1.5px solid #e5e5e5; border-radius: 14px; padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; }
.takeaway-img  { width: 62px; height: 62px; object-fit: cover; object-position: top; border-radius: 9px; border: 2px solid #e5e5e5; flex-shrink: 0; display: block; }
.takeaway-name  { font-size: 0.6rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #6A62D9; margin-bottom: 6px; }
.takeaway-quote { font-size: 0.8rem; color: #222; line-height: 1.65; border-left: 3px solid #6A62D9; padding-left: 12px; font-style: italic; }

.classroom-box { background: #f0eeff; border: 1.5px solid #d4d1f5; border-radius: 14px; padding: 16px 20px; }
.classroom-label { font-size: 0.62rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; color: #6A62D9; margin-bottom: 8px; }
.classroom-text  { font-size: 0.8rem; color: #333; line-height: 1.65; }
.classroom-text strong { color: #000; font-weight: 700; }

.btn-restart { background: transparent; border: 1.5px solid #d4d1f5; color: #6A62D9; border-radius: 8px; padding: 11px 32px; font-family: 'Geist', sans-serif; font-size: 0.85rem; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.15s, border-color 0.15s; }
.btn-restart:hover { background: #f0eeff; border-color: #a29ff0; }
.btn-restart:focus-visible { outline: 3px solid #6A62D9; outline-offset: 3px; }
.restart-note { text-align: center; font-size: 0.68rem; color: #aaa; margin-top: -10px; }
.sum-divider { height: 1px; background: #e5e5e5; }
</style>
</head>

  document.getElementById('summaryImg').alt              = L.summaryImgAlt;
  document.getElementById('bugSectionLabel').textContent = L.bugSectionLabel;
  document.getElementById('bugSectionTitle').textContent = L.bugSectionTitle;
  document.getElementById('bugAILabel').textContent      = L.bugAILabel;
  document.getElementById('bugAIComment').textContent    = L.bugAIComment;
  document.getElementById('bugFixLabel').textContent     = L.bugFixLabel;
  document.getElementById('bugFixComment').textContent   = L.bugFixComment;
  document.getElementById('bugExplanation').innerHTML    = L.bugExplanation;
  document.getElementById('recapTitle').textContent      = L.recapTitle;
  document.getElementById('legendIssue').textContent     = L.legendIssue;
  document.getElementById('legendPass').textContent      = L.legendPass;
  document.getElementById('takeawayImg').src             = L.teacherImgUrl;
  document.getElementById('takeawayImg').alt             = L.teacherImgAlt;
  document.getElementById('takeawayName').textContent    = L.takeawayName;
  document.getElementById('takeawayQuote').textContent   = L.takeawayQuote;
  document.getElementById('classroomLabel').textContent  = L.classroomLabel;
  document.getElementById('classroomText').innerHTML     = L.classroomText;
  document.getElementById('btnRestart').textContent      = '↺ ' + L.btnRestart;
  document.getElementById('restartNote').textContent     = L.restartNote;

  // Recap list
  const list = document.getElementById('recapList');
  list.innerHTML = '';
  L.recapChecks.forEach((c, i) => {
    const row = document.createElement('div');
    row.className = 'recap-row'; row.setAttribute('role','listitem');
    row.setAttribute('aria-label', (c.issue ? L.issueLabel : L.passLabel) + '. Check ' + (i+1) + ': ' + c.name + '. ' + c.note.replace(/<[^>]*>/g,''));
    row.innerHTML =
      '<div class="recap-indicator ' + (c.issue ? 'issue' : 'pass') + '" aria-hidden="true">' + (i+1) + '</div>' +
      '<div class="recap-content">' +
        '<div class="recap-check-name">' + c.name + ' <span class="recap-badge ' + (c.issue ? 'issue' : 'pass') + '">' + (c.issue ? L.issueLabel : L.passLabel) + '</span></div>' +
        '<div class="recap-note">' + c.note + '</div>' +
      '</div>';
    list.appendChild(row);
  });
}

/* ── START ── */
function startActivity() {
  document.getElementById('screen-intro').classList.remove('active');
  document.getElementById('screen-activity').classList.add('active');
  renderCheck(0);
  announce('Activity started. Check 1 of 6: ' + LANG.checks[0].title);
}

/* ── RENDER CHECK ── */
function renderCheck(idx) {
  answered = false;
  const c = LANG.checks[idx];

  // Progress
  const pct = Math.round((idx / 6) * 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressBar').setAttribute('aria-valuenow', pct);
  const progText = LANG.progressOf.replace('{n}', idx + 1) + ' — ' + c.title;
  document.getElementById('progressLabel').textContent = progText;

  // Check card
  document.getElementById('checkNum').textContent   = 'Check ' + (idx + 1) + ' of 6';
  document.getElementById('checkTitle').textContent = c.title;
  document.getElementById('checkTitle').setAttribute('id','checkTitle');
  document.getElementById('checkQuestion').innerHTML = c.question;

  // Buttons
  document.getElementById('btnPasses').textContent = LANG.btnPasses;
  document.getElementById('btnPasses').setAttribute('aria-label', LANG.btnPassesAriaPrefix.replace('{title}', c.title));
  document.getElementById('btnIssue').textContent  = LANG.btnIssue;
  document.getElementById('btnIssue').setAttribute('aria-label', LANG.btnIssueAriaPrefix.replace('{title}', c.title));
  document.getElementById('answerBtns').style.display = 'flex';

  // Reset feedback
  const fb = document.getElementById('feedbackBanner');
  fb.className = 'feedback-banner';
  fb.innerHTML = '';
  fb.innerHTML = '<div class="feedback-icon" id="feedbackIcon" aria-hidden="true"></div><div><div class="feedback-label" id="feedbackLabel"></div><div class="feedback-body" id="feedbackBody"></div></div>';

  // Next button
  const btnNext = document.getElementById('btnNext');
  btnNext.className = 'btn-next';
  btnNext.textContent = idx < 5 ? LANG.btnNext : LANG.btnSeeResults;

  // Character
  setChar(c.showTeacher);

  // Highlights
  clearHighlights();
  if (c.highlightLine) document.getElementById(c.highlightLine).classList.add('hl-purple');

  // Bug tag
  if (!c.showBugTag) document.getElementById('bugTag').classList.remove('show');
}

function setChar(isTeacher, reactionText) {
  const c = LANG.checks[current];
  const img    = document.getElementById('charImg');
  const name   = document.getElementById('charName');
  const bubble = document.getElementById('charBubble');
  const text   = document.getElementById('charText');

  if (reactionText) {
    img.src = LANG.studentImgUrl; img.alt = LANG.studentImgAlt;
    name.className = 'char-name student';
    name.textContent = LANG.studentName;
    bubble.className = 'char-bubble';
    text.textContent = reactionText;
  } else if (isTeacher) {
    img.src = LANG.teacherImgUrl; img.alt = LANG.teacherImgAlt;
    name.className = 'char-name teacher';
    name.textContent = LANG.teacherName;
    bubble.className = 'char-bubble teacher-bubble';
    text.textContent = c.teacherLine;
  } else {
    img.src = LANG.studentImgUrl; img.alt = LANG.studentImgAlt;
    name.className = 'char-name student';
    name.textContent = LANG.studentName;
    bubble.className = 'char-bubble';
    text.textContent = c.studentLine;
  }
}

function clearHighlights() {
  document.querySelectorAll('.code-line').forEach(l => l.classList.remove('hl-purple','hl-green'));
}

/* ── ANSWER ── */
function answer(userSaidIssue) {
  if (answered) return;
  answered = true;
  const c = LANG.checks[current];
  const isCorrect = (userSaidIssue === c.correctIsIssue);

  document.getElementById('answerBtns').style.display = 'none';

  // Feedback
  const fb = document.getElementById('feedbackBanner');
  document.getElementById('feedbackIcon').textContent  = isCorrect ? '💡' : '🔍';
  document.getElementById('feedbackLabel').textContent = isCorrect ? c.goodInstinctLabel : c.checkAgainLabel;
  document.getElementById('feedbackBody').innerHTML    = isCorrect ? c.goodInstinctBody  : c.checkAgainBody;
  fb.classList.add('show');

  // Console reveal
  if (c.consoleMsg === 'revealed') {
    const out = document.getElementById('consoleOut');
    out.innerHTML = '<span class="revealed">0<br>1<br>2<br>3<br>4<br>5</span><br><span class="warn">// 6 values — expected 5</span>';
    document.getElementById('act-actual').textContent = LANG.codeActualRevealed;
    document.getElementById('bugTag').classList.add('show');
    document.getElementById('line-3').classList.remove('hl-purple');
    document.getElementById('line-3').classList.add('hl-purple');
    document.getElementById('line-actual').classList.add('hl-purple');
  }

  // Student reaction
  const reaction = isCorrect ? c.studentReactionCorrect : c.studentReactionIncorrect;
  setTimeout(() => setChar(false, reaction), 1200);

  announce((isCorrect ? c.goodInstinctLabel : c.checkAgainLabel) + '. ' + (isCorrect ? c.goodInstinctBody : c.checkAgainBody).replace(/<[^>]*>/g,''));

  document.getElementById('btnNext').classList.add('show');
  document.getElementById('btnNext').focus();
}

/* ── NEXT ── */
function nextCheck() {
  current++;
  if (current >= 6) {
    showSummary();
  } else {
    renderCheck(current);
    announce(LANG.progressOf.replace('{n}', current + 1) + '. ' + LANG.checks[current].title);
    document.getElementById('checkTitle').focus();
  }
}

/* ── SUMMARY ── */
function showSummary() {
  document.getElementById('screen-activity').classList.remove('active');
  document.getElementById('screen-summary').classList.add('active');
  announce(LANG.summaryTitle);
  setTimeout(() => document.getElementById('summaryTitle').focus(), 100);
}

/* ── RESTART ── */
function restartActivity() {
  current = 0; answered = false;
  clearHighlights();
  document.getElementById('bugTag').classList.remove('show');
  document.getElementById('consoleOut').textContent = LANG.consoleInitial;
  document.getElementById('act-actual').textContent = LANG.codeActual;
  document.getElementById('screen-summary').classList.remove('active');
  document.getElementById('screen-activity').classList.add('active');
  renderCheck(0);
  announce('Activity restarted. Check 1 of 6.');
}

applyLang();
</script>
