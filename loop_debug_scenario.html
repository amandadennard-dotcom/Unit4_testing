      isCorrectYes: false,
      passText:    "The output does NOT match. The AI generated a loop that starts at 0, giving 6 values instead of 5. The code fails the match check.",

      <div style="font-size:0.82rem; color:#94a3b8; line-height:1.6;" id="missionText"></div>

<!-- SCREEN 2: ACTIVITY -->
<div id="screen-activity" class="screen" role="main" aria-label="Debugging activity">

  <!-- LEFT: IDE -->
  <div class="ide-panel" role="region" id="idePanel" aria-label="">
    <div class="ide-topbar" aria-hidden="true">
      <div class="ide-dots">
        <div class="ide-dot red"></div>
        <div class="ide-dot yellow"></div>
        <div class="ide-dot green"></div>
      </div>
      <div class="ide-tabs">

        <div class="ide-tab">index.html</div>
      </div>
    </div>

    <div class="ide-body" role="code" aria-label="Alex's loop code">
      <div class="code-line"><span class="line-num" aria-hidden="true">1</span><span class="line-code"><span class="cm" id="ideComment"></span></span></div>
      <div class="code-line"><span class="line-num" aria-hidden="true">2</span><span class="line-code"></span></div>
      <div class="code-line" id="line-3"><span class="line-num" aria-hidden="true">3</span><span class="line-code"><span class="kw">for</span> (<span class="kw">let</span> <span class="var">i</span> <span class="op">=</span> <span class="num">0</span>; <span class="var">i</span> <span class="op">&lt;=</span> <span class="num">5</span>; <span class="var">i</span><span class="op">++</span>) {</span><span class="bug-marker" id="bug1" aria-label="Bug found on this line"></span></div>
      <div class="code-line"><span class="line-num" aria-hidden="true">4</span><span class="line-code">&nbsp;&nbsp;<span class="fn">console</span>.<span class="fn">log</span>(<span class="var">i</span>);</span></div>
      <div class="code-line"><span class="line-num" aria-hidden="true">5</span><span class="line-code">}</span></div>
      <div class="code-line"><span class="line-num" aria-hidden="true">6</span><span class="line-code"></span></div>
      <div class="code-line"><span class="line-num" aria-hidden="true">7</span><span class="line-code"><span class="cm" id="ideExpected"></span></span></div>
      <div class="code-line"><span class="line-num" aria-hidden="true">8</span><span class="line-code"><span class="cm" id="ideExpectedVals"></span></span></div>
      <div class="code-line"><span class="line-num" aria-hidden="true">9</span><span class="line-code"></span></div>
      <div class="code-line"><span class="line-num" aria-hidden="true">10</span><span class="line-code"><span class="cm" id="ideActual"></span></span></div>
      <div class="code-line" id="line-11"><span class="line-num" aria-hidden="true">11</span><span class="line-code"><span class="cm" id="actual-output"></span></span></div>

    <div class="ide-console" role="region" id="consolePanel" aria-label="" aria-live="polite">

  </div>

  <!-- RIGHT PANEL -->
  <div class="right-panel">

    <!-- Progress -->
    <div class="progress-bar-wrap" role="region" aria-label="Progress through checks">
      <div class="progress-label">
        <span id="progressLabel" aria-live="polite"></span>
        <span id="progressPct" aria-hidden="true"></span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="progressBar" aria-valuenow="0">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="check-dots" id="checkDots" role="list" aria-label="Check completion status">
        <div class="cdot active" id="cdot-0" role="listitem" aria-label=""></div>
        <div class="cdot" id="cdot-1" role="listitem" aria-label=""></div>
        <div class="cdot" id="cdot-2" role="listitem" aria-label=""></div>
        <div class="cdot" id="cdot-3" role="listitem" aria-label=""></div>
        <div class="cdot" id="cdot-4" role="listitem" aria-label=""></div>
        <div class="cdot" id="cdot-5" role="listitem" aria-label=""></div>
      </div>
    </div>

    <!-- Character -->
    <div class="char-area" aria-live="polite" aria-atomic="true" role="region" aria-label="Character dialogue">
      <img id="charImg" src="" alt="" class="char-img" />
      <div class="char-bubble" id="charBubble" role="blockquote">
        <div class="who" id="charName" aria-hidden="true"></div>
        <span id="charText"></span>
      </div>
    </div>

    <!-- Check card -->
    <div class="check-card" role="region" aria-labelledby="checkTitle" id="checkCard">
      <div class="check-number" id="checkNum" aria-hidden="true"></div>
      <h2 class="check-title" id="checkTitle"></h2>
      <div class="check-question" id="checkQuestion"></div>
      <div class="answer-btns" id="answerBtns" role="group" aria-label="Answer options">
        <button class="btn-yes" id="btnYes" onclick="answer(true)"></button>
        <button class="btn-no"  id="btnNo"  onclick="answer(false)"></button>
      </div>
      <div class="result-reveal" id="resultReveal" role="alert" aria-live="assertive"></div>
    </div>

    <button class="btn-next" id="btnNext" onclick="nextCheck()"></button>
  </div>
</div>

<!-- SCREEN 3: SUMMARY -->
<div id="screen-summary" class="screen" role="main" aria-label="Summary of results">
  <div class="summary-card">
    <h1 class="summary-title" id="summaryTitle"></h1>
    <p class="summary-sub" id="summarySub"></p>

    <div class="summary-scene">
      <img id="summaryTeacherImg" src="" alt="" style="width:80px;height:80px;object-fit:cover;object-position:top;border-radius:10px;border:2px solid #2d3350;flex-shrink:0;" />
      <div class="speech-bubble teacher" role="blockquote">
        <div class="name-tag" style="color:#34d399;" id="summaryTeacherName" aria-hidden="true"></div>
        <span id="summaryTeacherBubble"></span>
      </div>
    </div>

    <div class="results-grid" id="resultsGrid" role="list" aria-label="Results for each check"></div>

    <div class="takeaway" role="note" id="takeawayText"></div>

    <button class="btn-restart" id="btnRestart" onclick="restartActivity()"></button>
  </div>
</div>

<script>
  /* ── Populate all text from LANG ── */
  function applyLang() {
    const L = LANG;
    document.title = L.pageTitle;

    // Intro
    document.getElementById('unitTag').textContent        = L.unitTag;
    document.getElementById('introTitle').innerHTML       = L.introTitle + ' <span style="color:#a78bfa;">' + L.introTitleSpan + '</span> ' + L.introTitleEnd;
    document.getElementById('introSub').textContent       = L.introSub;
    document.getElementById('introImg').src               = L.explainImgUrl;
    document.getElementById('introImg').alt               = L.introImgAlt;
    document.getElementById('introSceneAriaWrap').setAttribute('aria-label', L.introImgAlt);
    document.getElementById('introSpeakerName').textContent = L.introSpeakerName;
    document.getElementById('introBubble').innerHTML      = L.introBubble;
    document.getElementById('missionHeading').textContent = L.missionHeading;
    document.getElementById('missionText').innerHTML      = L.missionText;
    document.getElementById('startBtn').textContent       = L.startBtn;

    // IDE static text
    document.getElementById('ideComment').textContent     = L.ideComment;
    document.getElementById('ideExpected').textContent    = L.ideExpected;
    document.getElementById('ideExpectedVals').textContent= L.ideExpectedVals;
    document.getElementById('ideActual').textContent      = L.ideActual;
    document.getElementById('actual-output').textContent  = L.ideActualUnknown;
    document.getElementById('bug1').textContent           = L.bugLabel;
    document.getElementById('idePanel').setAttribute('aria-label', L.ideAriaLabel);
    document.getElementById('consoleLabel').textContent   = L.consoleLabel;
    document.getElementById('consolePanel').setAttribute('aria-label', L.consoleAriaLabel);
    document.getElementById('consoleOut').innerHTML       = '<span style="color:#475569;">' + L.consoleInitial + '</span>';

    // Summary static
    document.getElementById('summaryTitle').textContent   = L.summaryTitle;
    document.getElementById('summarySub').textContent     = L.summarySub;
    document.getElementById('summaryTeacherImg').src      = L.teacherImgUrl;
    document.getElementById('summaryTeacherImg').alt      = L.teacherImgAlt;
    document.getElementById('summaryTeacherName').textContent = L.teacherName;
    document.getElementById('summaryTeacherBubble').innerHTML = L.summaryTeacherBubble;
    document.getElementById('takeawayText').innerHTML     = L.takeawayText;
    document.getElementById('btnRestart').textContent     = L.btnRestart;

    // Dot labels
    for (let i = 0; i < 6; i++) {
      document.getElementById('cdot-' + i).setAttribute('aria-label',
        LANG.dotPendingLabel.replace('{n}', i + 1));
    }
    document.getElementById('cdot-0').setAttribute('aria-label',
      LANG.dotActiveLabel.replace('{n}', 1));
  }

  /* ── Activity state ── */
  const results = [];
  let currentCheck = 0;
  let answered = false;

  function announce(msg) {
    const el = document.getElementById('liveRegion');
    el.textContent = '';
    setTimeout(() => { el.textContent = msg; }, 50);
  }

  function startActivity() {
    document.getElementById('screen-intro').classList.remove('active');
    document.getElementById('screen-activity').classList.add('active');
    renderCheck(0);
    announce('Activity started. ' + LANG.progressOf.replace('{n}', 1));
  }

  function renderCheck(idx) {
    answered = false;
    const c = LANG.checks[idx];

    // Progress
    const pct = Math.round((idx / 6) * 100);
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressBar').setAttribute('aria-valuenow', pct);
    const progressText = LANG.progressOf.replace('{n}', idx + 1);
    document.getElementById('progressLabel').textContent = progressText;
    document.getElementById('progressPct').textContent = pct + '%';

    // Dots
    for (let i = 0; i < 6; i++) {
      const dot = document.getElementById('cdot-' + i);
      dot.className = 'cdot';
      if (i < idx) {
        dot.classList.add(results[i] ? 'done-pass' : 'done-fail');
        dot.setAttribute('aria-label', (results[i] ? LANG.dotPassLabel : LANG.dotFailLabel).replace('{n}', i + 1));
      } else if (i === idx) {
        dot.classList.add('active');
        dot.setAttribute('aria-label', LANG.dotActiveLabel.replace('{n}', i + 1));
      } else {
        dot.setAttribute('aria-label', LANG.dotPendingLabel.replace('{n}', i + 1));
      }
    }

    // Check card
    document.getElementById('checkNum').textContent = LANG.progressOf.replace('{n}', idx + 1);
    document.getElementById('checkTitle').textContent = c.title;
    document.getElementById('checkQuestion').innerHTML = c.question;

    // Buttons
    document.getElementById('answerBtns').style.display = 'flex';
    document.getElementById('btnYes').textContent = LANG.btnYes;
    document.getElementById('btnYes').setAttribute('aria-label', LANG.btnYesAriaPrefix.replace('{title}', c.title));
    document.getElementById('btnNo').textContent  = LANG.btnNo;
    document.getElementById('btnNo').setAttribute('aria-label', LANG.btnNoAriaPrefix.replace('{title}', c.title));

    const resultEl = document.getElementById('resultReveal');
    resultEl.className = 'result-reveal';
    resultEl.innerHTML = '';

    const btnNext = document.getElementById('btnNext');
    btnNext.className = 'btn-next';
    btnNext.textContent = idx < 5 ? LANG.btnNext : LANG.btnSeeResults;

    updateChar(c, false);
    clearHighlights();
    if (c.highlightLine) {
      document.getElementById(c.highlightLine).classList.add('highlight');
    }
  }

  function updateChar(c, afterAnswer) {
    const img    = document.getElementById('charImg');
    const bubble = document.getElementById('charBubble');
    const nameEl = document.getElementById('charName');
    const textEl = document.getElementById('charText');

    if (!afterAnswer) {
      if (c.showChar === 'student') {
        img.src = LANG.studentImgUrl; img.alt = LANG.studentImgAlt;
        bubble.className = 'char-bubble';
        nameEl.textContent = LANG.studentName;
        textEl.innerHTML = c.alexText;
      } else {
        img.src = LANG.teacherImgUrl; img.alt = LANG.teacherImgAlt;
        bubble.className = 'char-bubble is-teacher';
        nameEl.textContent = LANG.teacherName;
        textEl.innerHTML = c.teacherText;
      }
    } else {
      img.src = LANG.studentImgUrl; img.alt = LANG.studentImgAlt;
      bubble.className = 'char-bubble';
      nameEl.textContent = LANG.studentName;
      textEl.innerHTML = c.alexText;
    }
  }

  function answer(userSaidYes) {
    if (answered) return;
    answered = true;

    const c = LANG.checks[currentCheck];
    const isCorrect = (userSaidYes === c.isCorrectYes);
    results[currentCheck] = isCorrect;

    document.getElementById('answerBtns').style.display = 'none';

    const label = userSaidYes ? LANG.youSaidYes : LANG.youSaidNo;
    const detail = userSaidYes ? c.passText : c.failText;
    const resultEl = document.getElementById('resultReveal');
    resultEl.innerHTML = '<span class="result-icon">' + (userSaidYes ? '✓' : '✗') + '</span> <strong>' + label + '</strong><br>' + detail;
    resultEl.className = 'result-reveal show ' + (isCorrect ? 'pass' : 'fail');

    // Announce to screen readers
    announce(label + '. ' + detail.replace(/<[^>]*>/g, ''));

    document.getElementById('cdot-' + currentCheck).className = 'cdot ' + (isCorrect ? 'done-pass' : 'done-fail');
    document.getElementById('cdot-' + currentCheck).setAttribute('aria-label',
      (isCorrect ? LANG.dotPassLabel : LANG.dotFailLabel).replace('{n}', currentCheck + 1));

    if (c.consoleReveal) {
      document.getElementById('consoleOut').innerHTML =
        LANG.consoleRevealed.split('\n').filter(Boolean).map(n => n + '<br>').join('') +
        '<span class="err">' + LANG.consoleWarning + '</span>';
      document.getElementById('actual-output').textContent = LANG.ideActualRevealed;
      document.getElementById('line-3').classList.add('highlight');
      document.getElementById('bug1').classList.add('show');
    }

    updateChar(c, true);
    document.getElementById('btnNext').classList.add('show');
    document.getElementById('btnNext').focus();
  }

  function nextCheck() {
    currentCheck++;
    if (currentCheck >= 6) {
      showSummary();
    } else {
      renderCheck(currentCheck);
      announce(LANG.progressOf.replace('{n}', currentCheck + 1) + '. ' + LANG.checks[currentCheck].title);
      document.getElementById('checkTitle').focus();
    }
  }

  function clearHighlights() {
    document.querySelectorAll('.code-line').forEach(l => l.classList.remove('highlight', 'highlight-good'));
  }

  function showSummary() {
    document.getElementById('screen-activity').classList.remove('active');
    document.getElementById('screen-summary').classList.add('active');
    announce(LANG.summaryTitle);

    const grid = document.getElementById('resultsGrid');
    grid.innerHTML = '';
    LANG.checks.forEach((c, i) => {
      const row = document.createElement('div');
      row.className = 'result-row ' + (c.summaryIsBug ? 'fail-row' : 'pass-row');
      row.setAttribute('role', 'listitem');
      row.setAttribute('aria-label',
        (c.summaryIsBug ? 'Bug found' : 'Passed') + '. ' +
        LANG.summaryCheckPrefix + ' ' + (i + 1) + ': ' + c.title + '. ' + c.summaryNote);
      row.innerHTML =
        '<span class="ri" aria-hidden="true">' + (c.summaryIsBug ? LANG.summaryBugEmoji : LANG.summaryPassEmoji) + '</span>' +
        '<span class="rname">' + LANG.summaryCheckPrefix + ' ' + (i + 1) + ': ' + c.title + '</span>' +
        '<span class="rnote">' + c.summaryNote + '</span>';
      grid.appendChild(row);
    });

    document.getElementById('summaryTitle').focus();
  }

  function restartActivity() {
    currentCheck = 0;
    results.length = 0;
    answered = false;

    document.getElementById('consoleOut').innerHTML = '<span style="color:#475569;">' + LANG.consoleInitial + '</span>';
    document.getElementById('actual-output').textContent = LANG.ideActualUnknown;
    document.getElementById('bug1').classList.remove('show');
    clearHighlights();

    document.getElementById('screen-summary').classList.remove('active');
    document.getElementById('screen-activity').classList.add('active');
    renderCheck(0);
    announce('Activity restarted. Check 1 of 6.');
  }

  // Initialise
  applyLang();
</script>
</body>
